<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>الاستوديو المحلي | Voice Clone Studio</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a26;
      --border: #233047;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    header h1 {
      margin: 0;
      font-size: 1.35rem;
      color: #fff;
    }

    header p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #e2e8f0;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      background: #090d14;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      color: var(--text);
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .control-box {
      background: #090d14;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
    }

    .control-box span {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: #1e293b;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-stop {
      background: var(--danger);
    }

    .btn-cloud {
      width: 100%;
      background: var(--accent);
      padding: 13px;
      font-size: 0.96rem;
    }

    .status {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>الاستوديو المحلي للنطق</h1>
      <p>قراءة نصوص محلية بدون إنترنت، أو الانتقال إلى KikiVoice للاستنساخ السحابي</p>
    </header>

    <div class="card">
      <a class="btn btn-cloud" href="https://kikivoice.ai/">الانتقال إلى KikiVoice لاستنساخ الأصوات</a>
    </div>

    <div class="card">
      <label class="label" for="localText">نطق نص محلياً داخل الجهاز</label>
      <textarea id="localText" placeholder="اكتب النص هنا لتجربة النطق المحلي السريع..."></textarea>

      <div class="controls-grid">
        <div class="control-box">
          <span>
            <label for="rateRange">السرعة</label>
            <strong id="rateVal">0.95x</strong>
          </span>
          <input id="rateRange" type="range" min="0.60" max="1.40" step="0.05" value="0.95" oninput="updateSliders()" />
        </div>

        <div class="control-box">
          <span>
            <label for="pitchRange">الطبقة</label>
            <strong id="pitchVal">1.00x</strong>
          </span>
          <input id="pitchRange" type="range" min="0.70" max="1.30" step="0.05" value="1.00" oninput="updateSliders()" />
        </div>
      </div>

      <div class="btn-row">
        <button type="button" class="btn btn-primary" onclick="speakLocal()">تشغيل النطق</button>
        <button type="button" class="btn btn-stop" onclick="stopLocal()">إيقاف</button>
      </div>

      <div class="status" id="localStatus">جاهز للنطق المحلي</div>
    </div>
  </div>

  <script>
    function updateSliders() {
      const rate = parseFloat(document.getElementById('rateRange').value).toFixed(2);
      const pitch = parseFloat(document.getElementById('pitchRange').value).toFixed(2);
      document.getElementById('rateVal').textContent = `${rate}x`;
      document.getElementById('pitchVal').textContent = `${pitch}x`;
    }

    function speakLocal() {
      const text = document.getElementById('localText').value.trim();
      const status = document.getElementById('localStatus');

      if (!text) {
        status.textContent = 'يرجى كتابة نص أولاً.';
        return;
      }

      if (!('speechSynthesis' in window)) {
        status.textContent = 'محرك النطق المحلي غير متوفر على هذا الجهاز.';
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = /[\u0600-\u06FF]/.test(text) ? 'ar-SA' : 'en-US';
      utterance.rate = parseFloat(document.getElementById('rateRange').value);
      utterance.pitch = parseFloat(document.getElementById('pitchRange').value);

      utterance.onstart = () => {
        status.textContent = 'جاري النطق المحلي...';
      };
      utterance.onend = () => {
        status.textContent = 'اكتمل النطق المحلي.';
      };
      utterance.onerror = (e) => {
        status.textContent = `تعذر النطق: ${e.error || 'خطأ غير معروف'}`;
      };

      window.speechSynthesis.speak(utterance);
    }

    function stopLocal() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      document.getElementById('localStatus').textContent = 'تم الإيقاف.';
    }
  </script>
</body>
</html>
