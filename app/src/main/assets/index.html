<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>اختيار الأصوات | Voice Clone Studio</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a26;
      --border: #233047;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    header h1 {
      margin: 0;
      font-size: 1.35rem;
      color: #fff;
    }

    header p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #e2e8f0;
    }

    .audio-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: #1e293b;
      text-decoration: none;
    }

    .btn-record.recording {
      background: var(--danger);
    }

    .btn-save {
      width: 100%;
      background: var(--primary);
      margin-top: 8px;
    }

    .btn-site {
      width: 100%;
      background: var(--accent);
      padding: 14px;
      font-size: 1rem;
    }

    audio {
      width: 100%;
      margin-top: 8px;
      height: 38px;
    }

    .status {
      font-size: 0.83rem;
      color: var(--muted);
      margin-top: 6px;
      text-align: center;
      word-break: break-word;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>اختيار وتجهيز الأصوات</h1>
      <p>اختر أو سجّل الأصوات داخل التطبيق، ثم انتقل إلى المعالجة في الموقع</p>
    </header>

    <!-- العينة الصوتية المرجعية -->
    <div class="card">
      <span class="label">1. العينة الصوتية المرجعية (الصوت المستهدف استنساخه)</span>
      <div class="audio-actions">
        <button type="button" class="btn btn-record" id="btnRecRef" onclick="toggleRec('ref')">تسجيل عينة</button>
        <label class="btn" style="margin:0;">
          اختيار ملف
          <input type="file" accept="audio/*" class="hidden" onchange="onFilePick(event, 'ref')" />
        </label>
      </div>
      <div class="status" id="refStatus">لم يتم اختيار عينة مرجعية بعد</div>
      <audio id="refAudio" controls class="hidden"></audio>
      <button type="button" class="btn btn-save hidden" id="btnSaveRef" onclick="saveToDownloads('ref')">
        حفظ العينة في التنزيلات للرفع في الموقع
      </button>
    </div>

    <!-- الصوت المصدر -->
    <div class="card">
      <span class="label">2. الصوت المراد تحويله</span>
      <div class="audio-actions">
        <button type="button" class="btn btn-record" id="btnRecSrc" onclick="toggleRec('src')">تسجيل صوت</button>
        <label class="btn" style="margin:0;">
          اختيار ملف
          <input type="file" accept="audio/*" class="hidden" onchange="onFilePick(event, 'src')" />
        </label>
      </div>
      <div class="status" id="srcStatus">لم يتم اختيار صوت مصدر بعد</div>
      <audio id="srcAudio" controls class="hidden"></audio>
      <button type="button" class="btn btn-save hidden" id="btnSaveSrc" onclick="saveToDownloads('src')">
        حفظ الصوت المصدر في التنزيلات للرفع في الموقع
      </button>
    </div>

    <!-- الانتقال للمعالجة في الموقع -->
    <div class="card">
      <button type="button" class="btn btn-site" onclick="processOnSite()">
        معالجة في الموقع (KikiVoice)
      </button>
      <div class="status" id="siteStatus">سيتم فتح الموقع السحابي لاستكمال المعالجة</div>
    </div>
  </div>

  <script>
    let refBlob = null;
    let srcBlob = null;
    let mediaRecorder = null;
    let chunks = [];
    let recordingTarget = null;

    async function toggleRec(target) {
      const btn = document.getElementById(target === 'ref' ? 'btnRecRef' : 'btnRecSrc');
      const status = document.getElementById(target === 'ref' ? 'refStatus' : 'srcStatus');

      if (!recordingTarget) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          chunks = [];
          mediaRecorder = new MediaRecorder(stream);
          recordingTarget = target;

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) chunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'audio/webm' });
            stream.getTracks().forEach(t => t.stop());
            const doneTarget = recordingTarget;
            recordingTarget = null;
            btn.classList.remove('recording');
            btn.textContent = doneTarget === 'ref' ? 'تسجيل عينة' : 'تسجيل صوت';
            attachAudio(doneTarget, blob, 'تسجيل صوتي جديد');
          };

          mediaRecorder.start();
          btn.classList.add('recording');
          btn.textContent = 'إيقاف';
          status.textContent = 'جاري التسجيل...';
        } catch (err) {
          recordingTarget = null;
          btn.classList.remove('recording');
          status.textContent = 'تعذر التسجيل: ' + err.message;
        }
      } else if (recordingTarget === target && mediaRecorder) {
        mediaRecorder.stop();
      }
    }

    function onFilePick(event, target) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      attachAudio(target, file, file.name || 'ملف صوتي');
    }

    function attachAudio(target, blob, name) {
      const isRef = target === 'ref';
      if (isRef) refBlob = blob;
      else srcBlob = blob;

      const audio = document.getElementById(isRef ? 'refAudio' : 'srcAudio');
      const status = document.getElementById(isRef ? 'refStatus' : 'srcStatus');
      const saveBtn = document.getElementById(isRef ? 'btnSaveRef' : 'btnSaveSrc');

      audio.src = URL.createObjectURL(blob);
      audio.classList.remove('hidden');
      saveBtn.classList.remove('hidden');
      status.textContent = `تم الاختيار: ${name} (${(blob.size / 1024).toFixed(1)} KB)`;
    }

    function saveToDownloads(target) {
      const blob = target === 'ref' ? refBlob : srcBlob;
      if (!blob) return;

      const prefix = target === 'ref' ? 'reference_voice' : 'source_voice';
      const fileName = `${prefix}_${Date.now()}.mp3`;
      const reader = new FileReader();
      reader.onloadend = () => {
        if (window.AndroidBridge && typeof window.AndroidBridge.saveAudioFile === 'function') {
          window.AndroidBridge.saveAudioFile(reader.result, fileName);
        }
      };
      reader.readAsDataURL(blob);
    }

    function processOnSite() {
      if (window.AndroidBridge && typeof window.AndroidBridge.openCloudSite === 'function') {
        window.AndroidBridge.openCloudSite();
      } else {
        window.location.href = 'https://kikivoice.ai/';
      }
    }
  </script>
</body>
</html>
